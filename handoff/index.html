<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="/scripts/site-canonical.js"></script>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#00af64">
  <link rel="canonical" href="https://skister.app/handoff">
  <title>Skister — Übergabe bestätigen</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/assets/brand-tokens.css">
  <link rel="stylesheet" href="/assets/skister-auth-pages.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="/" aria-label="Skister Startseite">
      <img class="auth-logo" src="/assets/skister-logo-white.png" alt="Skister" width="1287" height="337" decoding="async">
    </a>
  </header>
  <div class="auth-main">
    <main class="auth-card" role="main" data-skister-handoff>
      <h1>Übergabe bestätigen</h1>
      <p class="subtitle">Beide Personen bestätigen Abholung und Rückgabe hier im Browser. Der QR-Code in der App bleibt gültig.</p>
      <p id="handoff-status" class="info" role="status" hidden></p>
      <form id="handoff-signin" class="stack">
        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary skister-btn-primary">Anmelden</button>
        <a class="btn-link" href="/login/">Passwort vergessen?</a>
      </form>
      <div id="handoff-list" class="stack" hidden></div>
      <a class="auth-footer" href="/">Zurück zu skister.app</a>
    </main>
  </div>
  <script type="module">
    import { initHandoffPage } from '/assets/skister-handoff.mjs'
    initHandoffPage()
  </script>
</body>
</html>
