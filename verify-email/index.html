<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="/scripts/site-canonical.js"></script>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#00AF64">
  <link rel="canonical" href="https://skister.app/verify-email">
  <title>Skister — Verify email</title>
  <link rel="icon" href="/favicon.ico?v=20261011" sizes="any">
  <link rel="stylesheet" href="/assets/skister-auth-pages.css">
</head>
<body>
  <main class="card" role="main" data-skister-verify>
    <div class="icon" id="icon" aria-hidden="true">✉️</div>
    <h1 id="title">Confirm your email</h1>
    <p class="lead" id="body">Check your inbox for the verification link from Skister.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="alert" id="alert" role="alert" hidden></div>

    <div id="panel-pending">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email">
      <div class="stack">
        <button type="button" class="btn btn-primary" id="resend">Resend verification email</button>
        <button type="button" class="btn-link" id="toggle-change">Wrong email? Change it before verifying</button>
      </div>
    </div>

    <form id="change-form" class="stack" hidden>
      <p class="subtitle">Enter your signup password to update the pending address.</p>
      <label for="new-email">New email</label>
      <input id="new-email" name="new-email" type="email" autocomplete="email">
      <label for="change-password">Password</label>
      <input id="change-password" name="change-password" type="password" autocomplete="current-password">
      <button type="submit" class="btn btn-secondary">Update email</button>
    </form>

    <div id="panel-success" hidden>
      <div class="stack">
        <button type="button" class="btn btn-primary" id="open-app">Open Skister app</button>
        <a class="btn btn-secondary" id="sign-in" href="/login/">Sign in on the web</a>
      </div>
      <p class="subtitle" style="margin-top: 1rem;">
        Browser verification does not sign you into the mobile app automatically. Use the same email and password in the app.
      </p>
    </div>

    <a class="home-link" href="/">Back to skister.app</a>
  </main>
  <script type="module">
    import { initVerifyEmailPage } from '/assets/skister-prod-auth-verify.mjs'
    initVerifyEmailPage()
  </script>
</body>
</html>
