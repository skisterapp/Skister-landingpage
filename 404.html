<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#00AF64">
  <title>Skister — Seite nicht gefunden</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary-green: #00AF64;
      --primary-green-light: #61C58E;
      --bg-dark: #0a0a0a;
      --text-white: #ffffff;
      --text-gray: #b0b0b0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }
    a { color: var(--primary-green-light); }
    a:focus-visible {
      outline: 2px solid var(--primary-green);
      outline-offset: 2px;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(10, 10, 10, 0.92);
    }
    .logo-image { height: 2rem; width: auto; display: block; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      color: var(--primary-green);
      margin-bottom: 0.75rem;
    }
    p { color: var(--text-gray); max-width: 32rem; margin: 0 auto 1.5rem; }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      background: var(--primary-green);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    .btn-home:hover { background: var(--primary-green-light); color: #0a0a0a; }
    footer {
      padding: 1rem 1.5rem;
      text-align: center;
      color: var(--text-gray);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <header>
    <a href="/" aria-label="Skister home">
      <img src="/assets/skister-logo-white.png" alt="Skister" class="logo-image" width="1287" height="337">
    </a>
  </header>
  <main>
    <div>
      <h1>404 — Seite nicht gefunden</h1>
      <p>Diese Seite existiert nicht oder wurde verschoben. Zurück zur Startseite oder zum Blog.</p>
      <p>
        <a class="btn-home" href="/">Zur Startseite</a>
        &nbsp;
        <a href="/blog/">Blog</a>
      </p>
    </div>
  </main>
  <footer>© 2026 Skister</footer>
</body>
</html>
