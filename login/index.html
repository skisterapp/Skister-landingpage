<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="/scripts/site-canonical.js"></script>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#00af64">
  <link rel="canonical" href="https://skister.app/login">
  <title>Skister — Anmelden</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/brand-tokens.css">
  <link rel="stylesheet" href="/assets/skister-auth-pages.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="/" aria-label="Skister Startseite">
      <img
        class="auth-logo"
        src="/assets/skister-logo-white.png"
        alt="Skister"
        width="1287"
        height="337"
        decoding="async"
      >
    </a>
  </header>
  <div class="auth-main">
    <main class="auth-card" role="main" data-skister-login>
      <h1 data-auth-i18n="login.title">Anmelden</h1>
      <p class="subtitle" id="subtitle" data-auth-i18n="login.subtitle">Melde dich im Browser an oder öffne die Skister-App auf deinem Smartphone.</p>
      <div class="alert" id="alert" role="alert" hidden></div>

      <div id="panel-signed-in" hidden>
        <div class="info" id="signed-in-hint"></div>
        <div class="stack">
          <button type="button" class="btn btn-primary skister-btn-primary" id="open-app" data-auth-i18n="login.openApp">Skister-App öffnen</button>
          <button type="button" class="btn btn-secondary" id="sign-out" data-auth-i18n="login.signOut">Im Browser abmelden</button>
        </div>
      </div>

      <div id="panel-signin">
        <form id="signin-form" class="stack">
          <label for="email" data-auth-i18n="login.emailLabel">E-Mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <label for="password" data-auth-i18n="login.passwordLabel">Passwort</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit" class="btn btn-primary skister-btn-primary" data-auth-i18n="login.submit">Anmelden</button>
          <button type="button" class="btn-link" id="forgot-toggle" data-auth-i18n="login.forgot">Passwort vergessen?</button>
        </form>
      </div>

      <div id="panel-forgot" hidden>
        <form id="forgot-form" class="stack">
          <p class="subtitle" data-auth-i18n="login.forgotHint">Wir senden dir einen sicheren Link zum Zurücksetzen (zeitlich begrenzt gültig).</p>
          <label for="forgot-email" data-auth-i18n="login.emailLabel">E-Mail</label>
          <input id="forgot-email" name="forgot-email" type="email" autocomplete="email" required>
          <button type="submit" class="btn btn-primary skister-btn-primary" data-auth-i18n="login.sendReset">Link senden</button>
          <button type="button" class="btn-link" id="forgot-back" data-auth-i18n="login.backSignIn">Zurück zur Anmeldung</button>
        </form>
        <p class="info" id="forgot-sent" hidden role="status"></p>
      </div>

      <div id="panel-recovery" hidden>
        <form id="recovery-form" class="stack">
          <label for="new-password" data-auth-i18n="login.newPassword">Neues Passwort</label>
          <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="6" required>
          <label for="confirm-password" data-auth-i18n="login.confirmPassword">Passwort bestätigen</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
          <button type="submit" class="btn btn-primary skister-btn-primary" data-auth-i18n="login.savePassword">Neues Passwort speichern</button>
        </form>
        <p class="info" id="recovery-done" hidden role="status"></p>
      </div>

      <a class="auth-footer" href="/" data-auth-i18n="common.backHome">Zurück zu skister.app</a>
    </main>
  </div>
  <script type="module">
    import { initLoginPage } from '/assets/skister-prod-auth-login.mjs'
    initLoginPage()
  </script>
</body>
</html>
